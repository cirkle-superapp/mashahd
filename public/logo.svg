<?xml version="1.0" encoding="utf-8"?>
<!-- Mashahd (مشاهِد) brand mark — three interlocking circles arranged
     in a triangle, with a gold→rose→teal gradient stroke and a gold
     center node. Mirrors src/app/icon.svg and the CIRKLE CircleMark
     (src/components/brand/CircleMark.tsx in github.com/fortleem/cirkle-ac8fabe4).
     Used as the public/logo.svg fallback for crawlers/OG scrapers. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="mashahd-public-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C2A060"/>
      <stop offset="50%" stop-color="#C06070"/>
      <stop offset="100%" stop-color="#1A4A5A"/>
    </linearGradient>
    <radialGradient id="mashahd-public-core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#E5C98A"/>
      <stop offset="100%" stop-color="#9A7A3E"/>
    </radialGradient>
  </defs>
  <!-- Background fill (cream) so the mark reads on tab bars / share cards. -->
  <rect width="100" height="100" rx="22" fill="#FDFCF9"/>
  <!-- Three interlocking circles forming a triangle (Venn-like). -->
  <circle cx="50" cy="32" r="22" stroke="url(#mashahd-public-grad)" stroke-width="4" fill="none"/>
  <circle cx="32" cy="60" r="22" stroke="url(#mashahd-public-grad)" stroke-width="4" fill="none"/>
  <circle cx="68" cy="60" r="22" stroke="url(#mashahd-public-grad)" stroke-width="4" fill="none"/>
  <!-- Center node — the meeting point of the three circles. -->
  <circle cx="50" cy="50.5" r="6.5" fill="url(#mashahd-public-core)"/>
  <circle cx="50" cy="50.5" r="2.2" fill="#FDFCF9" opacity="0.9"/>
</svg>
