name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint + TypeCheck + Build + Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma client
        run: bun run postinstall

      - name: Lint
        run: bun run lint

      - name: TypeCheck
        run: npx tsc --noEmit || true

      - name: Build
        run: bun run build
        env:
          DATABASE_URL: "file::memory:"
          TURSO_URL: ""
          TURSO_AUTH_TOKEN: ""

      - name: Basic tests
        run: npx tsx tests/basic.test.ts

      - name: Chaos tests
        run: npx tsx tests/chaos.test.ts
